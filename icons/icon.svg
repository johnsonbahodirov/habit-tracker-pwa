import {
  openDatabase,
  loadSettings,
  readAll,
  saveSettings,
  saveHabits,
  saveJournal,
  saveLogs,
  listBackups
} from './db.js';
import {
  DEFAULT_SETTINGS,
  state,
  habitTemplates,
  createDefaultHabit,
  createHabitFromTemplate,
  getTodayKey,
  normalizeHabit,
  flattenLogs,
  getHabitStatus,
  getLevelFromXP
} from './state.js';
import { renderApp, renderTemplateLibrary, closeModal, attachInitialHandlers } from './ui.js';
import { showToast, confirmDialog, showConfetti } from './notifications.js';
import { encryptBackup, decryptBackup, downloadBlob, exportProgressCardImage } from './backup.js';

let installPromptEvent = null;

async function initializeDatabase() {
  try {
    await openDatabase();
    const [habits, settings, journal, logs, backups] = await Promise.all([
      readAll('habits'),
      loadSettings(),
      readAll('journal'),
      readAll('logs'),
      listBackups()
    ]);

    state.settings = { ...DEFAULT_SETTINGS, ...(settings || {}) };
    state.habits = (habits || []).map((habit) => normalizeHabit(habit));

    state.journal = (journal || []).reduce((acc, entry) => {
      acc[entry.dateKey] = entry;
      return acc;
    }, {});

    state.logs = {};
    (logs || []).forEach((log) => {
      const { habitId, dateKey, ...rest } = log;
      if (!state.logs[habitId]) state.logs[habitId] = {};
      state.logs[habitId][dateKey] = rest;
    });

    if (!state.habits.length) {
      const seed = habitTemplates.slice(0, 3).map((template) => normalizeHabit({ ...template, id: crypto.randomUUID() }));
      state.habits = seed;
      await saveHabits(state.habits);
    }

    await saveSettings(state.settings);
    return backups;
  } catch (error) {
    console.error('Failed to initialize database', error);
    state.habits = habitTemplates.slice(0, 3).map((template) => normalizeHabit({ ...template, id: crypto.randomUUID() }));
    showToast('Using in-memory fallback mode');
  }
}

async function persistState() {
  try {
    await saveSettings(state.settings);
    await saveHabits(state.habits);
    await saveJournal(state.journal);
    await saveLogs(flattenLogs());
  } catch (error) {
    console.error('Persist failed', error);
    showToast('Failed to save data locally');
  }
}

function attachGlobalUI() {
  document.querySelectorAll('.nav-item, .mobile-nav-item').forEach((button) => {
    button.addEventListener('click', () => {
      state.currentView = button.dataset.view;
      renderApp();
    });
  });

  document.getElementById('addHabitBtn').addEventListener('click', () => {
    state.habits.push(createDefaultHabit());
    persistState();
    renderApp();
    showToast('Habit added');
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    persistState();
    renderApp();
  });

  document.getElementById('quoteRefreshBtn').addEventListener('click', () => {
    const quotes = [
      ['Small actions compound into big results.', 'HabitFlow'],
      ['Discipline is choosing what you want most over what you want now.', 'Abraham Lincoln'],
      ['Consistency creates momentum.', 'HabitFlow'],
      ['Well-being is built one day at a time.', 'HabitFlow']
    ];
    const [quote, author] = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('quoteText').textContent = `“${quote}”`;
    document.getElementById('quoteAuthor').textContent = `— ${author}`;
  });

  document.getElementById('backupBtn').addEventListener('click', async () => {
    const payload = { settings: state.settings, habits: state.habits, journal: state.journal, logs: flattenLogs() };
    downloadBlob(`habitflow-backup-${getTodayKey()}.json`, JSON.stringify(payload, null, 2));
    showToast('Backup downloaded');
  });

  document.getElementById('saveJournalBtn').addEventListener('click', () => {
    const dateKey = document.getElementById('journalDateInput').value || getTodayKey();
    state.journal[dateKey] = {
      dateKey,
      mood: document.getElementById('journalMoodSelect').value,
      note: document.getElementById('journalNoteInput').value.trim()
    };
    persistState();
    showToast('Journal saved');
    showConfetti();
  });

  document.getElementById('themeSelect').addEventListener('change', (event) => {
    state.settings.theme = event.target.value;
    persistState();
    renderApp();
  });

  document.getElementById('languageSelect').addEventListener('change', (event) => {
    state.settings.language = event.target.value;
    persistState();
    renderApp();
  });

  document.getElementById('accentPicker').addEventListener('input', (event) => {
    state.settings.accent = event.target.value;
    persistState();
    renderApp();
  });

  document.getElementById('fontSizeRange').addEventListener('input', (event) => {
    state.settings.fontSize = Number(event.target.value);
    persistState();
    renderApp();
  });

  document.getElementById('lockBtn').addEventListener('click', () => {
    const pin = document.getElementById('pinInput').value.trim();
    if (pin.length < 4) {
      showToast('PIN must be at least 4 digits');
      return;
    }
    state.settings.pin = pin;
    persistState();
    showToast('PIN lock enabled');
  });

  document.getElementById('resetDataBtn').addEventListener('click', async () => {
    const confirmed = await confirmDialog('Reset all data', 'This will clear habits, journal, and progress from this device. Continue?');
    if (!confirmed) return;
    state.habits = [];
    state.logs = {};
    state.journal = {};
    state.settings = { ...DEFAULT_SETTINGS };
    await persistState();
    renderApp();
    showToast('All data cleared');
  });

  document.getElementById('exportJsonBtn').addEventListener('click', () => {
    const payload = { settings: state.settings, habits: state.habits, journal: state.journal, logs: flattenLogs() };
    downloadBlob(`habitflow-export-${getTodayKey()}.json`, JSON.stringify(payload, null, 2));
    showToast('JSON export created');
  });

  document.getElementById('importJsonInput').addEventListener('change', async (event) => {
    const file = event.target.files?.[0];
    if (!file) return;

    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed.habits || !Array.isArray(parsed.habits)) {
        throw new Error('Invalid backup format');
      }
      state.habits = parsed.habits.map((habit) => normalizeHabit(habit));
      state.journal = parsed.journal || {};
      state.logs = {};
      (parsed.logs || []).forEach((log) => {
        const { habitId, dateKey, ...rest } = log;
        if (!state.logs[habitId]) state.logs[habitId] = {};
        state.logs[habitId][dateKey] = rest;
      });
      state.settings = { ...state.settings, ...(parsed.settings || {}) };
      await persistState();
      renderApp();
      showToast('Import completed');
    } catch (error) {
      console.error(error);
      showToast('Backup import failed');
    }
  });

  document.getElementById('encryptBackupBtn').addEventListener('click', async () => {
    const password = window.prompt('Enter a password to encrypt the backup');
    if (!password) return;
    const payload = { settings: state.settings, habits: state.habits, journal: state.journal, logs: flattenLogs() };
    const encrypted = await encryptBackup(payload, password);
    downloadBlob(`habitflow-encrypted-${getTodayKey()}.json`, encrypted, 'application/json');
    showToast('Encrypted backup saved');
  });

  document.getElementById('partnerModeBtn').addEventListener('click', () => {
    showToast('Partner mode is ready: import a friend’s habits file to compare progress.');
  });

  document.getElementById('shareCardBtn').addEventListener('click', () => {
    exportProgressCardImage({
      level: getLevelFromXP(state.settings.xp || 0),
      xp: state.settings.xp || 0,
      todayScore: computeDailyScore(state.habits || []),
      streak: 12
    });
    showToast('Progress image downloaded');
  });

  document.getElementById('templateLibraryBtn').addEventListener('click', () => renderTemplateLibrary());

  document.body.addEventListener('click', (event) => {
    const actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;

    if (action === 'toggle-habit') {
      const habit = state.habits.find((entry) => entry.id === actionEl.dataset.habitId);
      if (!habit) return;
      const dateKey = getTodayKey();
      const prevLog = state.logs[habit.id]?.[dateKey] || { completed: false, value: 0 };
      const nextComplete = !prevLog.completed;
      let nextValue = nextComplete ? 1 : 0;
      if (habit.type === 'counter') {
        nextValue = nextComplete ? Number(prevLog.value || 0) + 1 : 0;
      }
      if (habit.type === 'numeric' || habit.type === 'timer') {
        const promptValue = window.prompt(`Set value for ${habit.name}`, String(prevLog.value || habit.targetValue || 0));
        nextValue = Number(promptValue || 0);
      }
      state.logs[habit.id] = state.logs[habit.id] || {};
      state.logs[habit.id][dateKey] = { completed: nextComplete, value: nextValue };
      state.settings.xp = (state.settings.xp || 0) + 10;
      persistState();
      renderApp();
      showConfetti();
      return;
    }

    if (action === 'edit-habit') {
      const habit = state.habits.find((entry) => entry.id === actionEl.dataset.habitId);
      if (!habit) return;
      const newName = window.prompt('Edit habit name', habit.name);
      if (!newName) return;
      habit.name = newName.trim();
      persistState();
      renderApp();
      return;
    }

    if (action === 'delete-habit') {
      const habitId = actionEl.dataset.habitId;
      state.habits = state.habits.filter((habit) => habit.id !== habitId);
      persistState();
      renderApp();
      return;
    }

    if (action === 'add-template') {
      const templateName = actionEl.dataset.templateName;
      const template = habitTemplates.find((item) => item.name === templateName);
      if (!template) return;
      state.habits.push(createHabitFromTemplate(template));
      persistState();
      renderApp();
      closeModal();
      showToast(`${templateName} added`);
      return;
    }

    if (action === 'close-modal') {
      closeModal();
    }
  });

  document.body.addEventListener('click', (event) => {
    const closeBtn = event.target.closest('[data-close="close-modal"]');
    if (closeBtn) {
      closeModal();
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'n' && !event.metaKey && !event.ctrlKey && !event.altKey) {
      state.habits.push(createDefaultHabit());
      persistState();
      renderApp();
      showToast('Habit added');
    }
    if (event.key === 'j' && !event.metaKey && !event.ctrlKey && !event.altKey) {
      state.currentView = 'journal';
      renderApp();
    }
    if (event.key === 't' && !event.metaKey && !event.ctrlKey && !event.altKey) {
      state.currentView = 'today';
      renderApp();
    }
    if (event.key === '?') {
      showToast('Shortcuts: N add, T today, J journal');
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./sw.js');
        if (registration.waiting) {
          showToast('A new version is available. Refresh to update.');
        }
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (worker) {
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                showToast('New version ready — refresh to update');
              }
            });
          }
        });
      } catch (error) {
        console.error('SW registration failed', error);
      }
    });
  }

  window.addEventListener('beforeinstallprompt', (event) => {
    installPromptEvent = event;
    showToast('App can be installed');
  });
}

async function initialize() {
  await initializeDatabase();
  attachInitialHandlers();
  attachGlobalUI();
  renderApp();
}

window.addEventListener('DOMContentLoaded', initialize);
